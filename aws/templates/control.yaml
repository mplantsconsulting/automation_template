title: "<ルール名>"
category: "<security|network|reliability|operations|cost|data>"
severity: "<critical|high|medium|low>"

applicability:
  environments:
    - "<対象環境>"
  resource_types:
    - "<対象リソース種別>"
  conditions:
    - "<適用条件>"

